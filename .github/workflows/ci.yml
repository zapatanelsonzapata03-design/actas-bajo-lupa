name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar sin advertencias
        run: dotnet build --no-restore -warnaserror

      - name: Ejecutar pruebas
        run: dotnet test --no-build --verbosity normal

      - name: Generar evidencia de verificación
        run: dotnet run --project src/AuditaActas.Evidencia --no-build

      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-verificacion
          path: docs/evidencias/
